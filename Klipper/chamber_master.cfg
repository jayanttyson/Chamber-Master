# ==============================================================================
# Chamber Master - Klipper Configuration & Macros
# Tested and contributed by Richard Kennett (https://github.com/richard-kennett - Issue #3)
#
# Requirements:
#   1. gcode_shell_command extension enabled in Klipper (installed via KIAUH)
#   2. chamber_trigger.sh placed at $HOME/chamber_trigger.sh:
#        cp Klipper/chamber_trigger.sh ~/chamber_trigger.sh
#        chmod +x ~/chamber_trigger.sh
#   3. mDNS resolution package on Klipper host:
#        sudo apt update && sudo apt install -y mdns
#
# Installation:
#   Include this file in your printer.cfg:
#     [include chamber_master.cfg]
# ==============================================================================

[gcode_macro Chamber_Master]
description: Configuration variables for Chamber Master
variable_url: "enclosure-monitor.local"   # Matches hostname on OLED screen
gcode:
    # Configuration storage macro

[gcode_shell_command chamber_curl]
command: bash $HOME/chamber_trigger.sh
timeout: 4.0
verbose: True

[gcode_macro SET_CHAMBER]
description: Set Chamber Master material mode (PLA, ASA, ABS, TPU, PETG, CUSTOM, COOLDOWN) and optional target temperature
gcode:
    {% set cf = printer.configfile.settings %}
    {% set url = cf['gcode_macro chamber_master'].variable_url %}

    # 1. Read material and force to UPPERCASE
    {% set material = params.MATERIAL|default("XXX")|string|upper %}
    {% if material == "" %}
        {% set material = "XXX" %}
    {% endif %}

    # 2. Check if temperature was explicitly passed
    {% if 'TEMPERATURE' in params %}
        {% set temperature = params.TEMPERATURE|int %}
        RUN_SHELL_COMMAND CMD=chamber_curl PARAMS="{url} {material} {temperature}"
    {% else %}
        RUN_SHELL_COMMAND CMD=chamber_curl PARAMS="{url} {material}"
    {% endif %}

[gcode_macro SET_CHAMBER_MATERIAL]
description: Alias for SET_CHAMBER (backwards compatibility)
gcode:
    {% if 'TEMPERATURE' in params %}
        SET_CHAMBER MATERIAL={params.MATERIAL} TEMPERATURE={params.TEMPERATURE}
    {% else %}
        SET_CHAMBER MATERIAL={params.MATERIAL}
    {% endif %}

[gcode_macro START_CHAMBER_COOLDOWN]
description: Trigger Chamber Master adaptive enclosure cooldown routine
gcode:
    SET_CHAMBER MATERIAL=COOLDOWN
